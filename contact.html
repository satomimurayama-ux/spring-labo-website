<!-- ---------- Contact Form ---------- -->
<section class="contact-section">
  <div class="wrap contact-wrap">
    <p class="contact-lead">取材・メディア出演、講演、温泉施設や商品開発に関するご相談など、お気軽にお問い合わせください。</p>

    <form class="contact-form" action="https://formsubmit.co/murayama@spring-labo.com" method="post">
      <input type="hidden" name="_subject" value="Spring Labo LLC 公式サイトからのお問い合わせ">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" tabindex="-1" autocomplete="off" class="form-honey">
      <fieldset class="contact-fieldset">
        <legend>お問い合わせ内容</legend>
        <div class="contact-category-grid">
          <label class="category-option">
            <input type="radio" name="category" value="取材・メディア出演" checked>
            <span>取材・メディア出演</span>
          </label>
          <label class="category-option">
            <input type="radio" name="category" value="講演・セミナー">
            <span>講演・セミナー</span>
          </label>
          <label class="category-option">
            <input type="radio" name="category" value="温泉施設のご相談">
            <span>温泉施設のご相談</span>
          </label>
          <label class="category-option">
            <input type="radio" name="category" value="温泉資源・泉質のご相談">
            <span>温泉資源・泉質のご相談</span>
          </label>
          <label class="category-option">
            <input type="radio" name="category" value="商品・サービス開発">
            <span>商品・サービス開発</span>
          </label>
          <label class="category-option">
            <input type="radio" name="category" value="協業・提携">
            <span>協業・提携</span>
          </label>
          <label class="category-option">
            <input type="radio" name="category" value="その他">
            <span>その他</span>
          </label>
        </div>
      </fieldset>

      <div class="form-grid">
        <label>
          <span>お名前</span>
          <input type="text" name="name" autocomplete="name" required>
        </label>
        <label>
          <span>会社名・団体名</span>
          <input type="text" name="organization" autocomplete="organization" required>
        </label>
        <label>
          <span>メールアドレス</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          <span>電話番号</span>
          <input type="tel" name="tel" autocomplete="tel" required>
        </label>
      </div>

      <label class="form-full">
        <span>お問い合わせ内容</span>
        <textarea name="message" rows="7" required></textarea>
      </label>

      <p class="privacy-note">ご入力いただいた個人情報は、お問い合わせへの回答、サービスのご案内、必要なご連絡のために利用します。第三者に提供することはありません。</p>
      <label class="privacy-check">
        <input type="checkbox" name="privacy" required>
        <span>個人情報の取り扱いに同意します</span>
      </label>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">送信する</button>
      </div>
    </form>
  </div>
</section>
